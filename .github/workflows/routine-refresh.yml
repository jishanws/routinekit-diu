name: Routine Refresh Pipeline

on:
  schedule:
    # Run twice daily at 04:00 UTC and 16:00 UTC (10:00 AM and 10:00 PM BST)
    - cron: "0 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run routine scraper pipeline
        run: |
          python scraper/scraper.py

      - name: Commit and push changes if routine updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ scraper/last_known_good/
          if git diff --staged --quiet; then
            echo "No routine updates detected. Dataset is already current."
          else
            VERSION=$(jq -r '.current_version' public/data/status.json 2>/dev/null || echo "latest")
            git commit -m "chore(data): auto-refresh DIU CSE routine ($VERSION)"
            git push
          fi
